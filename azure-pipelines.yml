# Azure DevOps CI Pipeline for LinkVault
# Builds and pushes Backend and Frontend Docker images to Docker Hub

trigger:
  branches:
    include:
      - main
      - release/*

resources:
  - repo: self

variables:
  # The name of the Service Connection in Azure DevOps Settings
  # Ensure you create a Docker Registry Service Connection named 'docker-hub-connection'
  dockerRegistryServiceConnection: 'docker-hub-connection'
  
  # Repositories for Docker Hub (update 'mahmoudali2111' to your actual Docker Hub username/org)
  backendRepository: 'mahmoudali2111/linkvault-backend'
  frontendRepository: 'mahmoudali2111/linkvault-frontend'
  
  # Paths to Dockerfiles
  backendDockerfile: '$(Build.SourcesDirectory)/src/LinkVault.HttpApi.Host/Dockerfile'
  frontendDockerfile: '$(Build.SourcesDirectory)/angular/Dockerfile'
  
  # Tags
  buildTag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Push Docker Images
  jobs:
  - job: Build
    displayName: Build LinkVault Images
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    
    # 1. Build and Push Backend Image
    - task: Docker@2
      displayName: 'Build and push Backend image to Docker Hub'
      inputs:
        command: buildAndPush
        repository: $(backendRepository)
        dockerfile: $(backendDockerfile)
        buildContext: '$(Build.SourcesDirectory)'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(buildTag)
          latest

    # 2. Build and Push Frontend Image
    - task: Docker@2
      displayName: 'Build and push Frontend image to Docker Hub'
      inputs:
        command: buildAndPush
        repository: $(frontendRepository)
        dockerfile: $(frontendDockerfile)
        buildContext: '$(Build.SourcesDirectory)/angular'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(buildTag)
          latest
