# Local Jenkins for LinkVault CI.
#   copy .env.example .env   (then fill in the values)
#   docker compose up -d --build
# Jenkins UI: http://localhost:8090
services:
  jenkins:
    build: .
    image: linkvault-jenkins:local
    container_name: linkvault-jenkins
    # root so the pipeline can use the mounted Docker socket (fine for a local machine)
    user: root
    restart: unless-stopped
    ports:
      - "8090:8080"
    env_file: .env
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
